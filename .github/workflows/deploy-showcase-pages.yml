# Deploy Portfolio Showcase (showcase/) to GitHub Pages
# 任意人可通过 https://guajiuke.github.io/manufacturing-erp-lite/ 访问
# Triggered by push to showcase/** or this workflow file (or manual dispatch).
name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'showcase/**'
      - '.github/workflows/deploy-showcase-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Install dependencies
        working-directory: showcase
        run: npm ci

      - name: Typecheck & build
        working-directory: showcase
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
