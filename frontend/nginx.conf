# Manufacturing ERP Lite — nginx site config
#   /          → ERP admin SPA (Vite build) with history-mode fallback
#   /api/      → reverse-proxy to backend:8000
#   /showcase/ → Portfolio Showcase static site (Vue 3 + TS + Vite)
#   /docs/, /openapi.json → reverse-proxy to backend:8000 (FastAPI Swagger UI)

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- ERP SPA history-mode fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Portfolio Showcase static site ----
    # showcase/index.html 已自带 hash-free 路由（站点是单页 + 锚点导航），无需 fallback
    location /showcase/ {
        alias /usr/share/nginx/html/showcase/;
        index index.html;
        try_files $uri $uri/ $uri/index.html /showcase/index.html;
    }
    location = /showcase {
        return 301 /showcase/;
    }

    # ---- API reverse proxy -> backend service (compose-internal DNS) ----
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   60s;
    }

    # ---- FastAPI interactive docs (convenience for acceptance) ----
    location = /docs          { return 302 /docs/; }
    location /docs/           { proxy_pass http://backend:8000; }
    location = /openapi.json  { proxy_pass http://backend:8000; }
}